# docker-compose.stag.yml
services:
  server:
    container_name: crm-app-server
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT}
      SERVER_HOST: ${SERVER_HOST}
      POSTGRES_DB: crm_app_db_stag
      DATABASE_URL: ${DATABASE_URL_STAG}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}

  spring-server:
    container_name: crm-app-spring-server
    image: ${SPRING_SERVER_IMAGE}
    restart: unless-stopped
    ports:
      - "${SPRING_SERVER_PORT}:${SPRING_SERVER_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SERVER_PORT: ${SPRING_SERVER_PORT}

      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}

  frontend-proxy:
    image: ${FRONTEND_IMAGE}
    container_name: frontend-proxy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./client/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/staging.crm-appi.live/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/staging.crm-appi.live/privkey.pem:/etc/ssl/private/privkey.pem:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      NODE_ENV: production
