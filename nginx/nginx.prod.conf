# /root/nginx.prod.conf
events { }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream server {
        server server:3333; # Node.js server
    }

     server {
        listen 443 ssl;
        server_name staging.crm-appi.live;

        ssl_certificate /etc/letsencrypt/live/staging.crm-appi.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.crm-appi.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "HIGH:!aNULL:!MD5";

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Add HSTS header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/v1/ {
            proxy_pass http://server;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            access_log /var/log/nginx/access.log;
            error_log /var/log/nginx/error.log debug;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 60s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    server {
        listen 80;
        server_name ec2-13-60-156-45.eu-north-1.compute.amazonaws.com;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }
}