# docker-compose.ci.yml
services:
  server:
    container_name: crm-app-server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      POSTGRES_HOST: database-sql
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: crm_app_db_dev
      SERVER_PORT: ${SERVER_PORT}
      SERVER_HOST: ${SERVER_HOST}
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - migrate
      - database-sql
    command: ["npx", "tsx", "watch", "src/index.ts"]

  spring-server:
    container_name: crm-app-spring-server
    build:
      context: ./spring-server/crm-app
      dockerfile: Dockerfile.dev
    environment:  
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_TEST} 
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    # ports:
    #   - "8080:8080"
    #   - "35729:35729"
    depends_on:
      - database-sql
    # volumes:
    # - ./spring-server/crm-app:/app  

  database-sql:
    container_name: crm-app-postgresql-db
    image: postgres:16.4-bullseye
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

  migrate:
    container_name: crm-app-db-migrate
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: /bin/sh -c "npm run db:migrate:script:test && npm run db:migrate:script"
    depends_on:
      - database-sql
    environment:
      NODE_ENV: test
      POSTGRES_HOST: database-sql
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: crm_app_db_test
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}

  client:
    container_name: crm-app-client
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    depends_on:
      - server
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      VITE_BASE_URL: /api/v1

  nginx:
    image: nginx:1.27.1
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client
      - spring-server

volumes:
  postgres_data:
